name: ci

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Bootstrap package-lock on version branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/version/v0.0.1'
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo 'package-lock.json is already tracked'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: lock v0.0.1 npm dependencies'
          git push origin HEAD:version/v0.0.1
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - name: Verify GitHub runtime adapter is GET-only
        run: |
          if grep -R -nE "method:[[:space:]]*['\"](POST|PUT|PATCH|DELETE)['\"]" packages/github-adapter/src; then
            echo "GitHub adapter contains a write method" >&2
            exit 1
          fi
