name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run check
      - name: Verify GitHub runtime adapter is GET-only
        run: |
          if grep -R -nE "method:[[:space:]]*['\"](POST|PUT|PATCH|DELETE)['\"]" packages/github-adapter/src; then
            echo "GitHub adapter contains a write method" >&2
            exit 1
          fi
